[project]
name = "meetingminer-server"
version = "0.1.0"
description = "MeetingMiner server: api and worker processes plus their shared libraries"
# Pinned to one minor version, not a floor: the MLX ASR wheels (mlx-whisper,
# parakeet-mlx) publish no build for this machine's default 3.14, so the
# interpreter is part of the contract rather than an ambient property.
# `server/.python-version` points uv at it; AD-9 fixes the runtime to one
# Mac, so a narrow bound costs nothing.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.34",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    # format-nongpl extra: rfc3339-validator etc., so FormatChecker actually
    # asserts "date-time" on startedAt instead of silently skipping it.
    "jsonschema[format-nongpl]>=4.23",
    # Explicit dep (story 1.10): the one .env dialect shared with docker
    # compose --env-file. The loader parses via dotenv_values.
    "python-dotenv>=1.0",
    # The Apple Vision OCR engine (story 1.4). Marked macOS-only so the lock
    # stays resolvable elsewhere; the adapter imports the frameworks lazily and
    # reports unavailability instead of failing at import (AD-8/AD-9). Quartz
    # decodes the sampled JPEG into the CGImage Vision recognizes.
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    # Pillow (story 1.11): the only image decoder in the server. The `screens`
    # stage measures cropped pixel facts per sampled frame — white fraction,
    # mean saturation, change fraction — and surveys the share region once per
    # recording. Imported by `pipeline/frameimage.py` and nowhere else, so the
    # decision core stays engine-free.
    "pillow>=11",
    # The `Stt` port's two engines (story 1.5). MLX is Apple-silicon only, so
    # both carry the same macOS marker the Vision bindings do; the adapters
    # import them lazily and report unavailability instead of failing at
    # import (AD-8/AD-9).
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "parakeet-mlx>=0.3; sys_platform == 'darwin'",
    # The two projection stores (story 1.7). Imported ONLY under
    # `meetingminer/projections/` — AD-4's single-writer rule, asserted by
    # tests/test_projections_single_writer.py rather than left to convention.
    # The `Embedder` port deliberately adds no client dependency: it speaks
    # Ollama's HTTP API through the standard library.
    "neo4j>=6.0,<7",
    # The `Llm` port's one client (story 4.1, AD-8). Imported ONLY under
    # `meetingminer/adapters/llm/` — asserted by tests/test_extraction_core.py
    # the way the store clients are. The embedder deliberately avoided a client
    # dependency; AD-8 names LiteLLM for the `Llm` port specifically, because
    # it is what makes `llm.roles.*.model` a config-only swap across the
    # Anthropic and Ollama providers config.yaml declares.
    "litellm>=1.60",
    # Floored at the version this was built and tested against, because the
    # module uses API surface that older clients do not have:
    # `Index.update_embedders` / `get_embedders`,
    # `delete_documents(filter=...)`, and `retrieveVectors` on document reads.
    # A lower floor would resolve, type-check, and then fail at runtime
    # against a live store, so it is pinned to what is actually verified.
    "meilisearch>=0.43,<1",
]

[project.scripts]
# `uv run rebuild` — regenerate Neo4j + Meilisearch from Postgres + config.yaml
# alone (FR24, AD-4). Sits beside `make rebuild`, which is the same entry point.
rebuild = "meetingminer.projections.cli:main"
# `uv run backfill drop-paths` — one-shot conversion of pre-2.1a absolute drop
# paths to paths anchored to MM_DROPS_ROOT. Fails closed: any row it cannot
# place under the configured root is named and the exit code is non-zero.
backfill = "meetingminer.backfill:main"
# `uv run mint-drop <file> --corpus scripted` — mint a source drop from a local
# recording and/or transcript and hand it to the intake door (AD-1's second
# source: "local recording"). Sits beside `make mint-drop`, the same entry point.
mint-drop = "meetingminer.mintdrop:main"
# `uv run digest --output PATH` — write one example Morning Digest email from
# every published artifact in Postgres (FR31, story 4.5). Read-only, no
# delivery mechanism. Sits beside `make digest`, the same entry point.
digest = "meetingminer.digest.cli:main"
# `uv run prune --keep-corpus scripted` — delete every meeting outside an
# explicitly named keep-set, with its evidence, produced content and published
# documents. Reports by default; deleting takes `--delete`. Sits beside
# `make purge`, the same entry point.
prune = "meetingminer.prune.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<9.2",
    "httpx>=0.28",
    # Lint and type tooling in the fast loop (story 11.4, backlog B-4). Both
    # pinned to one minor: the rule set and the error surface move between
    # minors, and the dated baseline in [tool.ruff.lint] below is only green
    # against the versions it was measured with. Bumping a pin is a
    # deliberate act that re-runs the baseline math.
    "ruff>=0.16.5,<0.17",
    "mypy>=2.3.1,<2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["meetingminer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default selection is the fast set (story 11.1). `slow` marks the tests
# whose duration is set by something outside the test process — the Neo4j and
# Meilisearch test twins, spawned processes, the projection file lock, timers —
# and `-m 'not slow'` deselects them unless the command line says otherwise.
# `-m ""` on the command line replaces the expression and clears the filter:
# `make test` passes it to run everything, and so must any by-path run of a
# `slow` module, or pytest deselects every test in the file and exits 5 (with
# a one-line hint from tests/fast_budget.py). `--strict-markers` makes a
# misspelled or unregistered mark a collection error rather than a warning.
addopts = "-m 'not slow' --strict-markers"
markers = [
    "real_projection: opt this test out of test_artifact_publish's projection stub — it exercises the real stores",
    "slow: duration is set by something outside the test process (the store twins, spawned processes, the projection lock, timers); deselected by default, cleared with -m \"\"; reason= is required",
]
# Per-test budget for the fast set, in seconds, read once at configure time
# by tests/fast_budget.py (loaded from tests/conftest.py's pytest_plugins): a
# test that passes, carries no `slow` mark, and spends longer than this in its
# call phase is reported failed, naming the test and the remedies, so the
# default run cannot regrow silently. Call phase only — per-run database
# creation, migrations and store wipes are fixtures and amortise across the
# run; the budget guards test bodies. 2.0 sits above the fast set's slowest
# measured call (1.3s, test_frame_image, 2026-08-29 at e5510c7) and below any
# readiness poll or store task wait. Must be a positive, finite number.
# Override for one run with `-o mm_fast_test_budget_seconds=<seconds>`.
mm_fast_test_budget_seconds = "2.0"

# ---------------------------------------------------------------------------
# Lint (story 11.4, backlog B-4). Ruff's DEFAULT rule selection at the pinned
# minor — the `<0.17` dev-group pin is what holds the rule set still, so there
# is no select list here to audit; upgrading the pin re-runs the baseline
# math. Everything below is a dated baseline measured on main as it stood
# (2026-08-30 at 0.16.5: `ruff check server --isolated` reported 264
# violations, 200 file-code pairs across 108 files; this committed config
# surfaces 30 more, because `requires-python` sets target-version py312 and
# the isolated default does not reach UP017). Never a source sweep: no
# existing file was edited to satisfy a rule, and every entry is filed for
# per-module retirement in _bmad-output/implementation-artifacts/deferred-work.md.

[tool.ruff]
# Refuse to run under a ruff outside the dev-group pin: a different rule set
# would turn the dated baseline into noise (new violations) or dead entries.
required-version = ">=0.16.5,<0.17"

[tool.ruff.lint]
# The isolated 2026-08-30 run measured 200 file-code pairs; six mechanical
# codes carried 151 of them, leaving the 49 per-file entries below. UP017 is
# config-only: its 30 hits (11 more file-code pairs) appear on top of the
# measured 200 once this file sets target-version. A per-file table for all
# of that would drown the meaningful entries, so these seven codes are
# ignored globally — tree-wide, new files included, until retired — and
# filed as per-module cleanup in deferred-work.md; every other rule is live
# in every file. Hit counts at measurement:
ignore = [
    "I001",    # unsorted or unformatted import block (69 hits)
    "UP035",   # import from the deprecated typing aliases (50 hits)
    "PLW1510", # subprocess.run without an explicit `check=` (33 hits)
    "UP017",   # datetime.timezone.utc for datetime.UTC (30 hits, 11 files;
               # fires only under this config's py312 target-version)
    "SIM117",  # nested `with` statements (17 hits)
    "RUF100",  # unused noqa directive (14 hits)
    "UP037",   # quoted annotation (12 hits)
]

[tool.ruff.lint.per-file-ignores]
# The remaining 49 file-code pairs, verbatim from the same measurement, paths
# relative to server/. This table exempts only the existing files it lists;
# a new file gets every rule outside the seven globally ignored codes above.
# Retiring an entry is fixing the file and deleting its line (filed in
# deferred-work.md).
"meetingminer/adapters/diarize/__init__.py" = ["RUF022"]
"meetingminer/adapters/embed/ollama.py" = ["UP041"]
"meetingminer/api/chat_router.py" = ["RUF022"]
"meetingminer/api/citations.py" = ["RUF022"]
"meetingminer/api/status.py" = ["BLE001"]
"meetingminer/domain/drops.py" = ["B018"]
"meetingminer/mintdrop.py" = ["B018"]
"meetingminer/pipeline/extraction.py" = ["FURB167", "FURB188", "SIM102"]
"meetingminer/pipeline/frameimage.py" = ["RUF023"]
"meetingminer/pipeline/runner.py" = ["BLE001", "S110"]
"meetingminer/pipeline/screens.py" = ["RUF023"]
"meetingminer/pipeline/stages/transcribe.py" = ["F401"]
"meetingminer/projections/locks.py" = ["SIM115"]
"meetingminer/projections/traversals.py" = ["TRY004"]
"meetingminer/prune/cli.py" = ["SIM102"]
"meetingminer/worker/main.py" = ["F401"]
"tests/conftest.py" = ["BLE001", "ISC004", "S110"]
"tests/fast_budget.py" = ["TRY004"]
"tests/test_api_chat.py" = ["FURB188"]
"tests/test_api_registry.py" = ["PLR0402"]
"tests/test_digest.py" = ["F401"]
"tests/test_drops_root.py" = ["F401"]
"tests/test_extraction_core.py" = ["SIM102"]
"tests/test_fast_budget.py" = ["PIE810"]
"tests/test_frame_image.py" = ["C408"]
"tests/test_makefile_procs.py" = ["FURB167"]
"tests/test_mint_drop.py" = ["PYI034", "PYI036"]
"tests/test_ocr_adapter.py" = ["FLY002"]
"tests/test_parallel_store_safety.py" = ["PYI034", "S102"]
"tests/test_projections_chunking.py" = ["RUF007"]
"tests/test_projections_query.py" = ["F401"]
"tests/test_projections_rebuild.py" = ["RUF059"]
"tests/test_projections_single_writer.py" = ["SIM102"]
"tests/test_projections_traversals.py" = ["PYI034", "PYI036"]
"tests/test_prune.py" = ["B017", "F401", "RUF059"]
"tests/test_screens_core.py" = ["C408", "RUF059"]
"tests/test_screens_with_real_pixels.py" = ["C408"]
"tests/test_worker_transcripts.py" = ["RUF012"]

[tool.mypy]
# Typecheck scope (story 11.4): the architecture's decision cores —
# "Segmentation, classification, identity, chunking, and highlighting are
# database-free, model-free" (docs/architecture.md:205) — mapped to concrete
# modules. Encoded as `files` so `make typecheck` and a bare `python -m mypy`
# run from server/ agree on the scope; widening it is a config edit, pinned
# by tests/test_lint_contract.py.
files = [
    "meetingminer/domain/__init__.py",
    "meetingminer/domain/drops.py",
    "meetingminer/domain/jobs.py",
    "meetingminer/pipeline/alignment.py",
    "meetingminer/pipeline/extraction.py",
    "meetingminer/pipeline/moments.py",
    "meetingminer/pipeline/outputs.py",
    "meetingminer/pipeline/screens.py",
    "meetingminer/pipeline/speakers.py",
    "meetingminer/pipeline/transcripts.py",
    "meetingminer/projections/chunking.py",
    "meetingminer/projections/publish_gate.py",
    "meetingminer/projections/query.py",
]
check_untyped_defs = true

# Committed ignore baseline (2026-08-30), the mypy half of the no-sweep rule:
# jsonschema ships no type information and its stub package is not in the dev
# group (adding types-jsonschema would exceed the named dev-group edit);
# domain/drops.py imports it. Retirement filed in deferred-work.md.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
