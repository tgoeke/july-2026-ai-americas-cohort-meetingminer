<!doctype html>
<!-- Dark is the only mode (DESIGN.md · Colors). The class is here as well as
     applied by the shell, so the first paint is already dark: without it the
     document shows the unsupported light `:root` values for one frame. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetingMiner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
